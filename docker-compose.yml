# llama.cpp server (CUDA) running inside the LXC container.
# Put this file in /root/ai-local/ inside the container, next to the gguf/ folder.
#
# The API is published on port 8081 of the container, so other machines or
# containers on the LAN can reach it. It has no authentication: keep it on a
# trusted network, or bind it to a single address ("<CT_IP>:8081:8080").
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    container_name: llama-server
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8081:8080"
    volumes:
      - ./gguf:/models
    command: >
      --server
      -m /models/Qwen2.5-7B-Instruct-Q4_K_M.gguf
      --host 0.0.0.0
      --port 8080
      -ngl 999
    restart: unless-stopped
